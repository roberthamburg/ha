blueprint:
  name: "🔥 Advanced Heating Control V5 (Deutsch)"
  author: panhans (übersetzt)
  homeassistant:
    min_version: "2024.10.0"
  description: >
    🔥 Raumbezogene Heizungs- und Kühlungssteuerung basierend auf:


    > 👥 Anwesenheit von Personen

    🗓️ Mehreren Zeitplänen (Schedulern)

    🚶 Präsenzmeldern / Bewegungssensoren

    ↔️ Näherungserkennung (Proximity / Geofencing)


    🥶 Frostschutz

    😡 Einstellbarem aggressivem Modus

    🌤️ Aktivierung basierend auf Wetter, Temperatur oder Schaltern (Heizperiode)

    🎛️ Feinstufigen Zeitplan-Anpassungen

    🪟 Fenster-offen-Erkennung für mehrere Kontakte

    🎈 Party-Modus

    🤝 Gast-Modus

    ⚔️ Verkalkungsschutz (Ventil-Schutzfahrt)

    📍 Dynamischer Ventilpositionierung

    🧭 Thermostat-Kalibrierung für gängige Geräte (Tado, Aqara, Popp / Danfoss / Hive, Tuya etc.)

    ⚙️ Zahlreichen Optimierungen bei fehlerhaften Thermostaten

    🎬 Benutzerdefinierten Aktionen

    🤫 Ruhig & 💪 Zuverlässig


    **Stellen Sie sicher, dass die Uptime-Integration installiert ist:**

    [![Home Assistant Integration anzeigen](https://my.home-assistant.io/badges/integration.svg)](https://my.home-assistant.io/redirect/integration/?domain=uptime)


    **Version**: 5.5.9

    **Hilfe & FAQ**: [Advanced Heating Control](https://community.home-assistant.io/t/advanced-heating-control/469873)

    **Dokumentation:** [panhans.github.io/HomeAssistant/](https://panhans.github.io/HomeAssistant/)
  source_url: https://github.com/panhans/HomeAssistant/blob/main/blueprints/automation/panhans/advanced_heating_control.yaml
  domain: automation
  input:
    thermostat_section:
      name: Thermostate & Sensoren
      icon: mdi:thermostat
      input:
        input_trvs:
          name: 🔥 Thermostate / Klimageräte
          description: >
            `thermostate` `klimageräte`


            Zu steuernde [Thermostate / Klimageräte](https://www.home-assistant.io/integrations/climate/).
          selector:
            entity:
              filter:
                - domain:
                    - climate
              multiple: true

        input_temperature_sensor:
          name: 🌡️ Raumtemperatursensor
          description: >
            `kalibrierung` `aggressiver modus` `optional`


            Für einige Funktionen ist ein externer Temperatursensor erforderlich (z. B. Kalibrierung).

            Temperatur-Kalibrierung für Ihre [Thermostate](https://www.home-assistant.io/integrations/climate/). Folgendes wird unterstützt:

              * Tado, Aqara, Popp, Danfoss, Hive, Bosch, SONOFF, Tuya
              * Generische Kalibrierung

            Hinweis: Dies ist ein zusätzlicher Sensor im Raum (z. B. am Lieblingsplatz). Thermostate bzw. deren Integration (z. B. Z2M oder ZHA) – außer Tado – sollten eine separate Kalibrierungs-Entität bereitstellen.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - sensor
                  device_class:
                    - temperature
              multiple: false

    comfort_temperature_section:
      name: Komfortmodus-Einstellungen
      icon: mdi:weather-sunny
      description: >

        ### ☀️ Komfortmodus

        Der Komfortmodus wird aktiviert, wenn Ihr Zeitplan aktiv ist, jemand zu Hause ist oder Ihr Bewegungsmelder Präsenz erkennt.

        ### ⚙️ Minimalkonfiguration

        Für die Minimalkonfiguration reicht die Angabe der Fallback-Komforttemperatur völlig aus. Geben Sie einfach Ihre Wunschtemperatur ein. Sie können diese über einen Nummern-Helfer (Input Number) auch im Dashboard steuerbar machen.

        ### ⚙️ Erweiterte Konfiguration

        Wenn Sie die Komforttemperatur häufiger ändern möchten, können Sie hier einen Helfer für die normale Komforttemperatur hinterlegen.
        In dieser Konfiguration dient die statische Fallback-Temperatur als Referenz zum Zurücksetzen der manuell geänderten Werte.
        <br/><br/>
      collapsed: true
      input:
        input_temperature_comfort_static:
          name: 🌤️ Fallback-Komforttemperatur
          description: >
            `komforttemperatur`


            Zieltemperatur, wenn der Heizplan aktiv ist. Dient auch als Rückfallwert beim Zurücksetzen von temporären Temperaturänderungen.
          default: 22
          selector:
            number:
              min: 12.0
              max: 86.0
              step: 0.5
              mode: box
              unit_of_measurement: °C / °F

        input_temperature_comfort_static_entity:
          name: 🌤️ Fallback-Komforttemperatur (Helfer)
          description: >
            `komforttemperatur` `fallback` `optional`


            Um Ihre Fallback-Komforttemperatur über Automationen oder das Dashboard zu steuern, können Sie hier eine *[input_number](https://www.home-assistant.io/integrations/input_number/)*-Entität angeben.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_number
              multiple: false

        input_temperature_comfort:
          name: ☀️ Komforttemperatur (Helfer)
          description: >
            `komforttemperatur` `optional`


            Um Ihre Komforttemperatur dynamisch über Automationen oder das Dashboard zu regeln, wählen Sie hier einen *[input_number](https://www.home-assistant.io/integrations/input_number/)*-Helfer aus.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_number
              multiple: false

        input_hvac_mode_comfort:
          name: 🎛️ Betriebsart / HVAC-Modus (Komfort)
          description: >
            `komforttemperatur` `hvac`


            Wählen Sie den HVAC-Modus für Ihre Thermostate im Komfortbetrieb. Stellen Sie sicher, dass Ihre Thermostate diesen Modus unterstützen.
            Bei Heizkörperthermostaten ist dies meist *heat* (Heizen). Bei Klimageräten wird auch *auto* oder *cool* (Kühlen) unterstützt.
          default: "heat"
          selector:
            select:
              mode: dropdown
              options:
                - label: "Heizen (heat)"
                  value: heat
                - label: "Kühlen (cool)"
                  value: cool
                - label: "Automatik (auto)"
                  value: auto
                - label: "Heizen/Kühlen (heat_cool)"
                  value: heat_cool

    eco_temperature_section:
      name: Eco-Modus-Einstellungen (Spartemperatur)
      icon: mdi:leaf
      collapsed: true
      description: >

        ### 🍃 Eco-Modus

        Der Eco-Modus wird aktiviert, wenn der Zeitplan inaktiv ist, niemand zu Hause ist oder der Bewegungsmelder keine Anwesenheit feststellt.

        ### ⚙️ Minimalkonfiguration

        Für die Minimalkonfiguration reicht die Angabe der Fallback-Eco-Temperatur aus. Stellen Sie die gewünschte Absenktemperatur ein.

        ### ⚙️ Erweiterte Konfiguration

        Wenn Sie die Eco-Temperatur öfter verstellen möchten, können Sie dafür einen Nummern-Helfer (Input Number) zuweisen.
        <br/><br/>
      input:
        input_temperature_eco_static:
          name: 🌱 Fallback-Eco-Temperatur
          description: >
            `eco-temperatur` `absenktemperatur`


            Die Temperatur, die gehalten werden soll, wenn der Heizplan inaktiv ist (Absenktemperatur).
          default: 19
          selector:
            number:
              min: 4.0
              max: 75.0
              step: 0.5
              mode: box
              unit_of_measurement: °C / °F

        input_temperature_eco_static_entity:
          name: 🌱 Fallback-Eco-Temperatur (Helfer)
          description: >
            `eco-temperatur` `fallback` `optional`


            Ermöglicht die Steuerung der Fallback-Eco-Temperatur über eine *[input_number](https://www.home-assistant.io/integrations/input_number/)*-Entität.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_number
              multiple: false

        input_temperature_eco:
          name: 🍃 Eco-Temperatur (Helfer)
          description: >
            `eco-temperatur` `optional`


            Helfer (*[input_number](https://www.home-assistant.io/integrations/input_number/)*) zur dynamischen Verstellung der Eco-Temperatur im Dashboard.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_number
              multiple: false

        input_hvac_mode_eco:
          name: 🎛️ Betriebsart / HVAC-Modus (Eco)
          description: >
            `eco-temperatur` `hvac`


            Wählen Sie den HVAC-Modus im Eco-Betrieb. Für normale Heizkörperthermostate meist *heat* (Heizen auf Eco-Temperatur) oder *off* (vollständig Aus).
          default: "heat"
          selector:
            select:
              mode: dropdown
              options:
                - label: "Heizen (heat)"
                  value: "heat"
                - label: "Kühlen (cool)"
                  value: "cool"
                - label: "Automatik (auto)"
                  value: "auto"
                - label: "Heizen/Kühlen (heat_cool)"
                  value: "heat_cool"
                - label: "Aus (off)"
                  value: "off"

    # scheduler
    scheduling_section:
      name: Zeitpläne (Schedules)
      icon: mdi:clock-outline
      collapsed: true
      description: >

        ### ✅ Zeitpläne

        Mit Zeitplänen erstellen Sie Wochenprogramme, die automatisch zwischen Komfort- und Eco-Modus umschalten.
        Wenn Personen oder Annäherung definiert sind, wird der Komfortmodus nur aktiviert, wenn tatsächlich jemand zu Hause ist.
        <br/><br/>
      input:
        input_schedulers:
          name: ⏲️ Zeitpläne
          description: >
            `zeitpläne` `optional`


            Ein [Zeitplan-Helfer (Schedule)](https://www.home-assistant.io/integrations/schedule/) bestimmt, wann auf Komforttemperatur geheizt werden soll.
            Sind zusätzlich Personen oder Annäherung angegeben, greift das Heizen nur, wenn auch jemand zu Hause ist.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - schedule
              multiple: true

        input_scheduler_selector:
          name: ☝🏻 Zeitplan-Auswahlschalter
          description: >
            `zeitplan` `optional`


            Entität, um zwischen mehreren Zeitplänen umzuschalten. Wird nur ein einziger Zeitplan verwendet, kann dies ignoriert werden.<br/>

            <details>
            <summary><code><strong>HIER KLICKEN:</strong> Mehr Informationen zur Auswahl</code></summary>
            <br/>

            * Schalter ([input_boolean](https://www.home-assistant.io/integrations/input_boolean/) oder [binary_sensor](https://www.home-assistant.io/integrations/binary_sensor/)): Bei *Aus* ist der 1. Zeitplan aktiv, bei *Ein* der 2. Zeitplan.
            * Text / Dropdown-Menü ([input_select](https://www.home-assistant.io/integrations/input_select/) oder Sensor): Der Name muss mindestens teilweise mit dem Anzeigenamen des Zeitplans übereinstimmen (z. B. "Arbeit", "Urlaub", "Gäste").
            * Zahl ([input_number](https://www.home-assistant.io/integrations/input_number/)): Wert 1 wählt den 1. Zeitplan, Wert 2 den 2. Zeitplan usw.
            </details>
          default:
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - binary_sensor
                    - input_text
                    - input_number
                    - input_select
              multiple: false

    # persons
    person_section:
      name: Personen & Geräte (Anwesenheit)
      icon: mdi:account-multiple
      collapsed: true
      description: >

        ### 👨‍👩‍👧‍👦 Personen & Geräte

        Geben Sie die Personen oder Tracker an, die in diesem Haushalt leben. Zeitpläne für Komforttemperatur greifen nur dann, wenn diese Personen anwesend sind.
        Es wird empfohlen, Device-Tracker (z. B. Router-Erkennung) oder Personen-Entitäten zu verwenden.
        <br/><br/>
        📝 Falls Sie Geofencing / Annäherung nutzen möchten, lassen Sie dieses Feld leer und schauen Sie in den Abschnitt „Standort-Annäherung“.
        <br/><br/>
      input:
        input_persons:
          name: 👥 Personen / Geräte-Tracker
          description: >
            `person` `device tracker` `optional`


            Wählen Sie [Personen](https://www.home-assistant.io/integrations/person/) oder Tracker aus. Ohne Zeitpläne wird geheizt, sobald mindestens eine Person zu Hause ist.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - person
                    - device_tracker
              multiple: true

        input_people_entering_home_duration:
          name: 🏠 Verzögerung bei Ankunft
          description: >
            `person`


            Dauer, die eine Person mindestens zu Hause sein muss, bevor die Heizung anspringt (verhindert Fehlstarts bei kurzem Vorbeifahren).
          default:
            hours: 0
            minutes: 0
            seconds: 2
          selector:
            duration:

        input_people_leaving_home_duration:
          name: 💨 Verzögerung beim Verlassen
          description: >
            `person`


            Dauer, die alle Personen abwesend sein müssen, bevor die Heizung heruntergeregelt wird.
          default:
            hours: 0
            minutes: 0
            seconds: 2
          selector:
            duration:

        input_mode_guest:
          name: 🤝 Gast-Modus
          description: >
            `person` `optional`


            Wählen Sie hier einen Schalter oder Sensor. Ist dieser aktiv, wird simuliert, dass jemand zu Hause ist (praktisch, wenn Gäste im Haus sind, während Sie unterwegs sind).
          default:
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - binary_sensor
                    - timer
              multiple: false

    # proximity
    proximity_section:
      name: Standort-Annäherung (Geofencing)
      icon: mdi:leak
      collapsed: true
      description: >

        ### 🌍 Standort-Annäherung / Geofencing

        Ermöglicht das automatische Vorheizen bei Annäherung an das Zuhause über die Proximity-Integration von Home Assistant.
        <br/><br/>
      input:
        input_proximity:
          name: ↔️ Näherungssensor (Proximity)
          description: >
            `proximity` `optional`


            Wählen Sie Ihre Proximity-Zone aus. Nähert sich eine Person dem Haus innerhalb der eingestellten Distanz, startet das Heizen rechtzeitig vor der Ankunft.
          default:
          selector:
            device:
              filter:
                integration: proximity
              multiple: false

        input_proximity_duration:
          name: ⏰ Mindestdauer der Annäherung
          description: >
            `proximity`


            Zeitspanne, für die die Person auf dem Heimweg sein muss, bevor geheizt wird.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:

        input_proximity_distance:
          name: ↔️ Näherungs-Distanz (Radius)
          description: >
            `proximity`


            Entfernungsschwelle, ab der die Annäherung das Heizen auslöst (Einheit hängt von Ihrer Integration ab, meist Meter oder km).
          default: 500
          selector:
            number:
              min: 0
              max: 999999999
              step: 1
              mode: box

    # presence
    presence_section:
      name: Präsenzerkennung (Bewegungsmelder)
      icon: mdi:location-enter
      collapsed: true
      description: >

        ### 🔘 Präsenzerkennung im Raum

        Hier können Sie einen Raum-Präsenzmelder einbinden. Optional kann auch ein Zeitplan verknüpft werden, damit nachts trotz Bewegung nicht geheizt wird.
        <br/><br/>
      input:
        input_presence_sensor:
          name: 🚶 Präsenzmelder / Ein-Aus-Entität
          description: >
            `präsenzerkennung` `optional`


            Wird hier ein Bewegungsmelder oder Schalter hinterlegt, schaltet die Heizung auf Komfort, sobald Anwesenheit im Raum erkannt wird.
          default:
          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
              multiple: false

        input_scheduler_presence:
          name: ⏲️ Zeitplan für Präsenzmelder
          description: >
            `präsenzerkennung` `optional`


            Bestimmt das Zeitfenster am Tag, in dem der Präsenzmelder aktiv auf die Heizung wirken darf.
          default:
          selector:
            entity:
              filter:
                - domain:
                    - schedule
              multiple: false

        input_presence_reaction_on_time:
          name: ⏳ Reaktionszeit bei erkannter Anwesenheit
          description: >
            `präsenzerkennung`


            Dauer, wie lange Präsenz dauerhaft anstehen muss, bevor auf Komforttemperatur hochgeregelt wird.
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:

        input_presence_reaction_off_time:
          name: ⌛ Nachlaufzeit bei Abwesenheit
          description: >
            `präsenzerkennung`


            Dauer, für die keine Bewegung mehr gemeldet werden darf, bevor wieder in den Eco-Modus gewechselt wird.
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:

    adjustment_section:
      name: Heizplan-Anpassungen & Sonderfunktionen
      icon: mdi:sun-clock
      collapsed: true
      description: >

        ### 🎛️ Anpassungen & Feinjustierung

        In diesem Bereich können Sie zu bestimmten Uhrzeiten gezielt Temperaturen oder Modi überschreiben.

        ### ⚙️ Weitere Optionen

        Möglichkeit zum Setzen von Timern, Partymodus oder dem Erzwingen von Maximal- bzw. Eco-Temperaturen.
        <br/><br/>
      input:
        input_adjustments:
          name: 🎛️ Heizplan-Anpassungen (Zeitsteuerung)
          description: >
            `optional`


            Hier können Sie punktuelle Anpassungen zum Zeitplan eintragen (z. B. andere Zieltemperaturen an bestimmten Tagen oder Uhrzeiten).<br/><br/>

            <details>
            <summary><code><strong>HIER KLICKEN:</strong> Parameter</code></summary>
            <br/>

            > 🕔 **time**: Uhrzeit, zu der die Anpassung greift (erforderlich, z. B. "08:00")<br/>
            > 📆 **days**: Wochentage ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']<br/>
            > 🗓️ **scheduler**: Nur aktivieren, wenn dieser Text im Namen des aktiven Zeitplans vorkommt<br/>
            > 🛋️ **comfort**: Abweichende Komforttemperatur<br/>
            > 🌱 **eco**: Abweichende Eco-Temperatur<br/>
            > 🧭 **calibration**: Kalibrierung umschalten (on/off)<br/>
            > 🔘 **mode**: Betriebsart überschreiben (comfort/eco/off/auto)
            </details>
          selector:
            object:
          default: "[]"

        input_sync_adjustments_with_entities:
          name: 🔄️ Anpassungen mit Entitäten abgleichen
          description: >
            `optional`


            Wenn aktiv, werden die definierten Anpassungen mit den Komfort- und Eco-Helfern synchronisiert.
          selector:
            boolean:
          default: true

        input_force_max_temperature:
          name: 🥵 Maximale Temperatur erzwingen
          description: >
            `optional`


            Schalter, um sofort alle Thermostate auf Maximaltemperatur zu stellen (z. B. zu Wartungszwecken oder Stoßheizen).
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - binary_sensor
              multiple: false

        input_force_eco_temperature:
          name: 🌱 Eco-Temperatur erzwingen
          description: >
            `optional`


            Schalter, um dauerhaft den sparsamen Eco-Modus zu erzwingen.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - binary_sensor
              multiple: false

        input_mode_party:
          name: 🎈 Party-Modus
          description: >
            `optional`


            Ist diese Entität aktiv, werden Zeitpläne ignoriert und durchgeheizt. Wenn der Anzeigename mit einer Zahl endet (z. B. *Party Timer 21*), wird diese Zahl direkt als Zieltemperatur verwendet.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - binary_sensor
                    - timer
              multiple: true

        input_party_legacy_restore:
          name: 🔄 Altes Wiederherstellungsverhalten (Party)
          description: >
            `party`


            Aktivieren, falls die Temperaturen nach Beendigung des Party-Modus nicht korrekt wiederhergestellt werden.
          default: false
          selector:
            boolean:

    temperature_tweak_section:
      name: Temperatur-Optimierungen & Verhalten
      icon: mdi:knob
      collapsed: true
      input:
        input_min_instead_of_off:
          name: ⬇️ Mindesttemperatur statt Ausschalten
          description: >
            `optional` `optimierung`


            Senkt das Thermostat auf die niedrigste mögliche Temperatur ab, anstatt es komplett auf *OFF* zu schalten (wichtig bei Modellen, die bei *OFF* Fehler melden).
          default: false
          selector:
            boolean:

        input_fahrenheit:
          name: 🇫 Fahrenheit-Skala nutzen
          description: >
            `optional`


            Aktivieren, wenn Ihre Maßeinheit Fahrenheit ist.
          default: false
          selector:
            boolean:

        input_reset_temperature:
          name: ↩️ Temperatur automatisch zurücksetzen
          description: >
            `optional`


            Setzt dynamische Temperatur-Helfer nach Ende des Zeitplans, der Präsenz oder Anwesenheit automatisch wieder auf die Standardwerte zurück.
          default: false
          selector:
            boolean:

        input_off_if_above_room_temperature:
          name: ↕️ Abschalten, wenn Raumtemperatur bereits erreicht
          description: >
            Schaltet das Thermostat komplett aus (*off*), sobald die gemessene Raumtemperatur über der Zieltemperatur liegt.
          default: false
          selector:
            boolean:

        input_off_if_nobody_home:
          name: 🏠🚶‍➡️ Ausschalten bei vollständiger Abwesenheit
          description: >
            Schaltet die Thermostate komplett auf *off*, wenn Personen definiert sind und niemand zu Hause ist.
          default: false
          selector:
            boolean:

        input_ui_change:
          name: 📲 Manuelle Dashboard-Änderung synchronisieren
          description: >
            `experimentell`


            Wird die Temperatur auf der Thermostat-Kachel im Dashboard verstellt, wird dieser Wert auf alle Thermostate im Raum und den aktiven Temperatur-Helfer übertragen.
          default: false
          selector:
            boolean:

        input_physical_change:
          name: 🛞 Manuelle Drehrad-Verstellung synchronisieren
          description: >
            `experimentell`


            Wird das Thermostat direkt am Heizkörper per Hand verstellt, gleicht Home Assistant alle weiteren Thermostate im Raum darauf an.
          default: false
          selector:
            boolean:

    # away mode
    away_section:
      name: Abwesenheitsmodus (Unterwegs)
      icon: mdi:walk
      collapsed: true
      description: >

        ### 🏃 Abwesenheitsmodus (Away Mode)

        Ermöglicht eine leichte Temperaturabsenkung (Offset), wenn Sie das Haus während eines aktiven Heizfensters kurzzeitig verlassen.
        <br/><br/>
      input:
        input_away_offset:
          name: 🏃 Abwesenheits-Temperaturdifferenz (Offset)
          description: >
            `abwesenheit`


            Wert in Grad, um den die Komforttemperatur abgesenkt wird, wenn der Zeitplan eigentlich aktiv ist, aber niemand zu Hause ist.
          default: 0
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: °C / °F

        input_away_scheduler_mode:
          name: ⏲️ Abwesenheitsmodus für Zeitpläne aktivieren
          description: >
            Aktiviert den Abwesenheits-Offset während zeitplanbasierter Heizphasen.
          default: false
          selector:
            boolean:

        input_away_presence_mode:
          name: 🚶 Abwesenheitsmodus für Präsenzmelder aktivieren
          description: >
            Aktiviert den Offset bei fehlender Bewegung im Raum.
          default: false
          selector:
            boolean:

        input_away_presence_ignor_people:
          name: 🚶 Personenstatus für Raumabwesenheit ignorieren
          description: >
            Senkt die Temperatur auch ab, wenn generell jemand im Haus ist, sich aber niemand im konkreten Raum aufhält.
          default: false
          selector:
            boolean:

    # windows
    window_section:
      name: Fenster- & Türerkennung (Lüften)
      icon: mdi:door
      collapsed: true
      input:
        input_windows:
          name: 🪟 Fenster- und Türkontakte
          description: >
            `lüften` `optional`


            Wählen Sie Ihre Fenstersensoren aus. Beim Öffnen werden die Thermostate im Raum während des Lüftens automatisch abgedreht.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
                    - sensor
              multiple: true

        input_windows_reaction_time_open:
          name: ⏳ Schließ-Verzögerung nach Öffnen
          description: >
            Zeitspanne, die ein Fenster offen stehen muss, bevor das Thermostat schließt (verhindert ständiges Schalten bei kurzem Durchgehen).
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration:

        input_windows_reaction_time_close:
          name: ⌛ Wiederaufnahme nach Schließen
          description: >
            Wartezeit nach dem Schließen der Fenster, bevor das Heizen wieder aufgenommen wird.
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration:

        input_window_open_temperature:
          name: 🌡️ Feste Absenktemperatur bei offenem Fenster
          description: >
            Temperatur während des Lüftens. Bei 0 °C wird das Thermostat vollständig ausgeschaltet (*off*).
          default: 0
          selector:
            number:
              min: 0
              max: 15
              step: 1
              mode: slider
              unit_of_measurement: °C / °F

        input_window_open_temperature_number:
          name: 🌡️ Helfer für Fensteroffen-Temperatur
          description: >
            Optionaler *input_number*-Helfer, um die Lüftungstemperatur im Dashboard zu steuern.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_number
              multiple: false

        input_window_legacy_restore:
          name: 🏚️ Altes Wiederherstellungsverhalten (Fenster)
          description: >
            Aktivieren, wenn nach dem Schließen des Fensters die vorherige Temperatur nicht korrekt wiederhergestellt wird.
          default: false
          selector:
            boolean:

    # calibration
    calibration_section:
      name: Temperatur-Kalibrierung (Offset-Abgleich)
      icon: mdi:compass
      description: ""
      collapsed: true
      input:
        input_is_calibration_enabled:
          name: 🟢 Kalibrierung aktivieren
          description: >
            Aktiviert den laufenden Abgleich zwischen externem Raumtemperatursensor und Thermostat.
          default: true
          selector:
            boolean:

        input_calibration_key_word:
          name: 🗝️ Such-Stichwort für Kalibrierungs-Entität
          description: >
            Stichwort in der Entity-ID der Kalibrierungs-Entität Ihres Thermostats (z. B. `offset`, `calibration` oder `external`).
          default: "calibration"
          selector:
            text:

        input_calibration_timeout:
          name: ⏳ Mindestabstand zwischen Kalibrierungen
          description: >
            Mindestzeitspanne zwischen zwei Kalibrierungsaufrufen, um Funk-Traffic und Batterie zu schonen (mindestens 2 Sekunden empfohlen).
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration:

        input_calibration_delta:
          name: ↔️ Mindest-Temperaturdifferenz
          description: >
            Erst wenn die Abweichung zwischen Raum- und Thermostattemperatur größer als dieser Wert ist, wird neu kalibriert.
          default: 0.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              mode: slider
              unit_of_measurement: °C / °F

        input_calibration_step_size:
          name: 🦶 Schrittgröße bei der Kalibrierung
          description: >
            Schrittweite, in der das Thermostat Kalibrierungswerte akzeptiert.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatisch
                  value: auto
                - label: "0.1 °C"
                  value: "0.1"
                - label: "0.5 °C"
                  value: "0.5"
                - label: "Ganze Werte (1.0 °C)"
                  value: "full"

        input_calibration_generic:
          name: 🧭 Generische Kalibrierung nutzen
          description: >
            Rechnet die gemessene Temperaturabweichung direkt auf die Solltemperatur auf. Nützlich für Thermostate ohne eigene Kalibrierungs-Entität.
          default: false
          selector:
            boolean:

        input_generic_calibration_offset:
          name: ↕️ Maximaler Offset für generische Kalibrierung
          description: >
            Begrenzt den maximal zulässigen Korrekturwert bei der generischen Kalibrierung.
          default: 5
          selector:
            number:
              min: 0
              max: 20
              step: 1
              mode: slider
              unit_of_measurement: °C / °F

    # aggressive mode
    aggressive_mode_section:
      name: Aggressiver Modus (Schnellaufheizung)
      icon: mdi:emoticon-angry
      collapsed: true
      input:
        input_aggressive_mode_range:
          name: 😡 Toleranzbereich für aggressiven Modus
          description: >
            Aktivieren, wenn Ihre Thermostate bei geringen Temperaturunterschieden zu träge öffnen. Definiert den Bereich um die Zieltemperatur, in dem normal geregelt wird.
          default: 0
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              mode: slider
              unit_of_measurement: °C / °F

        input_aggressive_mode_offset:
          name: ↕ Aggressiver Temperatur-Offset
          description: >
            Zusätzliche Überhöhung der Solltemperatur bei kalten Räumen, um das Ventil schlagartig voll aufzudrücken.
          default: 0
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: °C / °F

        input_aggressive_mode_calibration:
          name: 🌡️ Aggressive Kalibrierung
          description: >
            `experimentell`


            Wendet den aggressiven Offset auf den Kalibrierungswert anstatt auf die Zieltemperatur an.
          default: false
          selector:
            boolean:

    # frost protection
    frostprotection_section:
      name: Frostschutz
      icon: mdi:snowflake
      collapsed: true
      description: >

        ### ❄️ Frostschutz

        Fällt bei langer Abwesenheit die Heizung aus oder ist niemand mehr im Haus, schützt diese Mindesttemperatur vor Frostschäden.
        <br/><br/>
      input:
        input_frost_protection_temp:
          name: ❄️ Frostschutztemperatur
          description: >
            Mindest-Zieltemperatur zum Schutz vor dem Einfrieren der Rohre.
          default: 5
          selector:
            number:
              min: 5.0
              max: 62.0
              step: 0.5
              mode: box
              unit_of_measurement: °C / °F

        input_frost_protection_duration:
          name: ❄️ Wartezeit bis Frostschutz aktiv wird
          description: >
            Zeitdauer längerer Abwesenheit, nach der auf Frostschutztemperatur abgesenkt wird (0 = deaktiviert).
          default:
            days: 0
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true

    # liming protection
    liming_protection_section:
      name: Verkalkungsschutz (Ventil-Schutzfahrt)
      icon: mdi:pipe-valve
      collapsed: true
      input:
        input_liming_protection:
          name: 🎚️ Verkalkungsschutz aktivieren
          description: >
            Öffnet das Ventil einmal pro Woche für kurze Zeit vollständig und schließt es wieder, um ein Festkalken des Ventilstifts im Sommer zu verhindern.
          default: off
          selector:
            boolean:

        input_liming_protection_day:
          name: 🗓️ Ausführungstag
          description: >
            Wochentag für die Schutzfahrt.
          default: "Mon"
          selector:
            select:
              options:
                - label: Montag
                  value: Mon
                - label: Dienstag
                  value: Tue
                - label: Mittwoch
                  value: Wed
                - label: Donnerstag
                  value: Thu
                - label: Freitag
                  value: Fri
                - label: Samstag
                  value: Sat
                - label: Sonntag
                  value: Sun

        input_liming_protection_time:
          name: 🕖 Uhrzeit
          description: >
            Uhrzeit für die wöchentliche Schutzfahrt.
          default: "12:00:00"
          selector:
            time:

        input_liming_protection_duration:
          name: 🕖 Dauer der Schutzfahrt
          description: >
            Dauer in Minuten, für die das Ventil voll geöffnet bleibt.
          default: 1
          selector:
            number:
              min: 1
              max: 30
              step: 1
              mode: slider
              unit_of_measurement: min

        input_liming_in_winter:
          name: 🌨️ Schutzfahrt auch im aktiven Winterbetrieb ausführen
          description: >
            Führt den Verkalkungsschutz auch aus, wenn die normale Heizungsautomation aktiv ist.
          default: false
          selector:
            boolean:

    # winter mode
    toggle_section:
      name: Ein/Aus Automatik-Optionen (Heizperiode)
      icon: mdi:light-switch
      collapsed: true
      input:
        input_mode_winter:
          name: ⛄ Wintermodus / Heizperiode (Zentraler Schalter)
          description: >
            `aktivierung` `optional`


            Zentraler Schalter (z. B. `input_boolean.heizperiode`). Steht er auf *Ein*, läuft die Automatik normal. Steht er auf *Aus*, gehen die Thermostate in den Sommerschlaf.
          default:
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - binary_sensor
              multiple: false

        input_invert_winter_mode_value:
          name: 🔄 Wintermodus-Logik invertieren
          description: >
            Invertiert die Schaltlogik (Aus = Automatik aktiv, Ein = Automatik inaktiv).
          default: off
          selector:
            boolean:

        input_mode_outside_temperature:
          name: 🌤️ Außentemperatursensor / Wetterdienst
          description: >
            Steuert die Heizung anhand der realen Außentemperatur.
          default:
          selector:
            entity:
              filter:
                - domain:
                    - weather
                - domain:
                    - sensor
                  device_class: temperature
              multiple: false

        input_mode_outside_temperature_threshold:
          name: 🎚️ Schwellenwert Außentemperatur
          description: >
            Fällt die Außentemperatur unter diesen Wert, schaltet die Heizung ein.
          default: 15
          selector:
            number:
              min: 5
              max: 68
              step: 0.5
              mode: box
              unit_of_measurement: °C / °F

        input_fallback_outside_temperature_unavailable:
          name: 🌡️ Verhalten bei Ausfall des Außentemperatursensors
          description: >
            Legt fest, ob die Heizung aktiviert werden soll, falls der Außensensor nicht erreichbar ist.
          default: false
          selector:
            boolean:

        input_temperature_off:
          name: 🌱 Standby-Temperatur bei inaktiver Automatik
          description: >
            Temperatur bei inaktiver Automation (z. B. im Sommer). Der Wert *0* schaltet die Thermostate komplett auf *off*.
          default: 0
          selector:
            number:
              min: 4.0
              max: 75.0
              step: 0.5
              mode: box
              unit_of_measurement: °C / °F

        input_mode_room_temperature:
          name: 🔘 Raumtemperatur-Schwelle einbeziehen
          description: >
            Zusätzliche Bedingung, dass auch die Raumtemperatur unter einen bestimmten Schwellenwert fallen muss. (Eher für Klimaanlagen empfohlen).
          default: false
          selector:
            boolean:

        input_mode_room_temperature_threshold:
          name: 🎚️ Schwellenwert Raumtemperatur
          description: >
            Temperaturschwelle für den Raumtemperatursensor.
          default: 18
          selector:
            number:
              min: 5
              max: 68
              step: 0.5
              mode: box
              unit_of_measurement: °C / °F

    # valve positioning
    valve_positioning_section:
      name: Dynamische Ventilpositionierung / PID
      icon: mdi:valve
      collapsed: true
      description: >

        ### 🤏 Dynamische Ventilpositionierung

        Öffnet das Ventil proportional zur Abweichung zwischen Ist- und Solltemperatur, sofern Ihre Thermostate eine direkte Prozent-Ventilsteuerung unterstützen.
        <br/><br/>
      input:
        input_valve_positioning_mode:
          name: 🦶 Berechnungsmodus der Ventilöffnung
          description: >
            📈 **regular**: Lineare Öffnung proportional zum Temperaturunterschied.<br/>
            😊 **optimistic**: Reduziert die Öffnung frühzeitig (nutzt Restwärme der Heizkörper).<br/>
            🙁 **pessimistic**: Hält das Ventil länger weit offen für maximal schnelles Aufheizen.
          default: "off"
          selector:
            select:
              mode: dropdown
              options:
                - label: "Aus (off)"
                  value: "off"
                - label: "Linear (regular)"
                  value: "regular"
                - label: "Optimistisch (optimistic)"
                  value: "optimistic"
                - label: "Pessimistisch (pessimistic)"
                  value: "pessimistic"

        input_fully_open_difference:
          name: ↔️ Temperaturdifferenz für 100% Ventilöffnung
          description: >
            Temperaturunterschied, ab dem das Ventil vollständig geöffnet wird.
          default: 1
          selector:
            number:
              min: 0.5
              max: 20
              step: 0.5
              mode: box
              unit_of_measurement: °C / °F

        input_valve_positioning_step_size:
          name: 🦶 Schrittgröße der Ventilposition
          description: >
            Schrittweite in Prozent für Öffnungsänderungen.
          default: "10"
          selector:
            select:
              mode: dropdown
              options:
                - label: "5%"
                  value: "5"
                - label: "10%"
                  value: "10"
                - label: "20%"
                  value: "20"

        input_valve_positioning_max_opening:
          name: 🎚️ Maximale Ventilöffnung
          description: >
            Begrenzt den maximalen Öffnungsgrad (z. B. auf 80 % oder 90 %).
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"

        input_valve_positioning_timeout:
          name: ⏱️ Mindestabstand zwischen Ventilanpassungen
          description: >
            Zeitspanne, die zwischen zwei Nachjustierungen des Ventils liegen muss.
          default:
            hours: 0
            minutes: 20
            seconds: 0
          selector:
            duration:

        input_valve_opening_keyword:
          name: 🗝️ Suchbegriff für Ventilöffnungs-Entität
          description: >
            Stichwort in der Entity-ID zur Steuerung des Öffnungsgrades.
          default: "valve_opening_degree"
          selector:
            text:

    # tweaks
    tweak_section:
      name: System-Feineinstellungen & Eigene Aktionen
      icon: mdi:cog-box
      collapsed: true
      input:
        input_action_call_delay:
          name: ⚙️ Verzögerung zwischen Befehlen
          description: >
            Wartezeit zwischen Steuerbefehlen. Verhindert Überlastung und Funkstau bei mehreren Thermostaten.
          default:
            hours: 0
            minutes: 0
            seconds: 2
          selector:
            duration:

        input_startup_delay:
          name: ⏲ Startverzögerung nach HA-Neustart
          description: >
            Verzögert die Ausführung nach einem Systemstart, bis alle Sensoren und Integrationen vollständig initialisiert sind (Uptime-Integration erforderlich).
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

        # custom action
        input_custom_action:
          name: 🎬 Eigene Folge-Aktion
          description: >
            Wird bei jeder Temperatur-/Modusänderung ausgeführt. Variable `is_heating` kann in Bedingungen abgefragt werden (`true` = Heizen aktiv).
          default:
          selector:
            action:

        input_custom_condition:
          name: ☑️ Eigene Bedingung für Temperaturänderung
          description: >
            Zusätzliche Bedingung, die Temperaturänderungen freigibt oder blockiert.
          default:
          selector:
            condition:

        input_custom_condition_calibration:
          name: ☑️ Eigene Bedingung für Kalibrierung
          description: >
            Zusätzliche Bedingung, die Kalibrierungsschritte freigibt oder blockiert.
          default:
          selector:
            condition:

        input_log_level:
          name: ✍️ Protokollierungsstufe (Log Level)
          description: ""
          default: debug
          selector:
            select:
              mode: dropdown
              options:
                - info
                - warning
                - error
                - debug

trigger_variables:
  input_trvs: !input input_trvs
  input_temperature_sensor: !input input_temperature_sensor
  is_temperature_sensor_defined: "{{ input_temperature_sensor != [] }}"

  input_persons: !input input_persons
  input_mode_guest: !input input_mode_guest
  input_people_entering_home_duration: !input input_people_entering_home_duration
  input_people_leaving_home_duration: !input input_people_leaving_home_duration

  input_person_count: "{{ input_persons | count }}"
  is_person_defined: "{{ input_person_count > 0 }}"
  is_guest_mode_defined: "{{ input_mode_guest != none }}"

  input_schedulers: !input input_schedulers
  input_scheduler_selector: !input input_scheduler_selector
  input_scheduler_presence: !input input_scheduler_presence
  is_scheduler_presence_defined: "{{ input_scheduler_presence != none }}"

  input_temperature_comfort: !input input_temperature_comfort
  input_temperature_eco: !input input_temperature_eco
  input_hvac_mode_eco: !input input_hvac_mode_eco
  input_hvac_mode_comfort: !input input_hvac_mode_comfort
  factor: "{{ iif(input_hvac_mode_eco == 'cool' or input_hvac_mode_comfort == 'cool', -1, 1) | int }}"
  is_heat_only_if_below_real_temp: !input input_off_if_above_room_temperature

  input_mode_winter: !input input_mode_winter
  input_mode_outside_temperature: !input input_mode_outside_temperature
  input_mode_outside_temperature_threshold: !input input_mode_outside_temperature_threshold
  input_fallback_outside_temperature_unavailable: !input input_fallback_outside_temperature_unavailable
  input_mode_room_temperature_threshold: !input input_mode_room_temperature_threshold
  input_mode_room_temperature: !input input_mode_room_temperature
  input_invert_winter_mode_value: !input input_invert_winter_mode_value
  input_temperature_off: !input input_temperature_off

  input_mode_party: !input input_mode_party

  input_adjustments: !input input_adjustments

  input_calibration_timeout: !input input_calibration_timeout
  is_calibration_enabled: !input input_is_calibration_enabled
  input_calibration_key_word: !input input_calibration_key_word

  input_windows: !input input_windows

  input_presence_sensor: !input input_presence_sensor
  is_presence_sensor_defined: "{{ input_presence_sensor != none }}"
  input_presence_reaction_on_time: !input input_presence_reaction_on_time
  input_presence_reaction_off_time: !input input_presence_reaction_off_time

  input_proximity: !input input_proximity
  input_proximity_duration: !input input_proximity_duration
  input_proximity_distance: !input input_proximity_distance

  input_frost_protection_duration: !input input_frost_protection_duration

  input_liming_protection: !input input_liming_protection
  input_liming_protection_day: !input input_liming_protection_day
  input_liming_protection_time: !input input_liming_protection_time
  input_liming_in_winter: !input input_liming_in_winter
  input_liming_protection_duration: !input input_liming_protection_duration

trigger:
  - trigger: homeassistant
    event: start
    id: temperature_change_hastart

  - trigger: event
    event_type: automation_reloaded
    id: temperature_change_reload

  - trigger: event
    event_type: ahc_delay_event
    id: delayed_call_temperature_change
    event_data:
      automation: "{{ this.entity_id }}"

  - trigger: event
    event_type: ahc_positioning_event
    id: positioning_event
    event_data:
      automation: "{{ this.entity_id }}"

  - trigger: state
    entity_id: !input input_trvs
    from:
      - unknown
      - unavailable
    for:
      seconds: 5
    id: temperature_change_available

  - trigger: state
    entity_id: !input input_trvs
    attribute: temperature
    for:
      seconds: 5
    id: temperature_change_valve_target

  - trigger: state
    entity_id: !input input_temperature_eco
    for: !input input_action_call_delay
    id: temperature_change_eco

  - trigger: state
    entity_id: !input input_temperature_comfort
    for: !input input_action_call_delay
    id: temperature_change_comfort

  - trigger: state
    entity_id: !input input_temperature_eco_static_entity
    for: !input input_action_call_delay
    id: temperature_change_eco_fallback

  - trigger: state
    entity_id: !input input_temperature_comfort_static_entity
    for: !input input_action_call_delay
    id: temperature_change_comfort_fallback

  - trigger: template
    value_template: >
      {{ input_persons  | expand
                        | selectattr('state', 'eq', 'home')
                        | list
                        | count > 0

        or (is_guest_mode_defined and states(input_mode_guest) in ['on','active'] ) }}
    id: temperature_change_person_on
    for: !input input_people_entering_home_duration

  - trigger: template
    value_template: >
      {{ input_persons  | expand
                        | selectattr('state', 'eq', 'home')
                        | list
                        | count == 0

        and (not is_guest_mode_defined or (is_guest_mode_defined and states(input_mode_guest) not in ['on','active'])) }}
    id: temperature_change_person_off
    for: !input input_people_leaving_home_duration

  - trigger: template
    id: temperature_change_scheduler_on
    value_template: >
      {% set selected_scheduler = none %}
      {% set schedules_count = input_schedulers | count %}

      {% if schedules_count == 0 %}
        {% set selected_scheduler = none %}
      {% elif schedules_count == 1 or input_scheduler_selector == none %}
        {% set selected_scheduler = input_schedulers | first %}
      {% elif schedules_count > 1 %}
        {% set selector_value = states(input_scheduler_selector) %}

        {% if is_number(selector_value) %}
          {% set selector_value = iif(selector_value | int > schedules_count, schedules_count, selector_value) %}
          {% set selector_value = iif(selector_value | int <= 0, 1, selector_value) %}
          {% set selected_scheduler = input_schedulers[selector_value | int - 1] %}
        {% elif selector_value in ['on','off'] %}
          {% set selected_scheduler = iif(selector_value == 'off', input_schedulers[0], input_schedulers[1]) %}
        {% else %}
          {% set selected_scheduler = input_schedulers | expand | selectattr('attributes.friendly_name', 'eq', selector_value) | map(attribute='entity_id') | first | default(none) %}
          {% if (selected_scheduler == none) %}
            {% set selected_scheduler = input_schedulers | expand | selectattr('attributes.friendly_name', 'search', '(?i)' + selector_value) | map(attribute='entity_id') | first | default(none) %}
          {% endif %}
        {% endif %}
      {% endif %}

      {% if selected_scheduler == none %}
        {{ false }}
      {% else %}
        {{ is_state(selected_scheduler, 'on') }}
      {% endif %}

  - trigger: template
    id: temperature_change_scheduler_off
    value_template: >
      {% set selected_scheduler = none %}
      {% set schedules_count = input_schedulers | count %}

      {% if schedules_count == 0 %}
        {% set selected_scheduler = none %}
      {% elif schedules_count == 1 or input_scheduler_selector == none %}
        {% set selected_scheduler = input_schedulers | first %}
      {% elif schedules_count > 1 %}
        {% set selector_value = states(input_scheduler_selector) %}

        {% if is_number(selector_value) %}
          {% set selector_value = iif(selector_value | int > schedules_count, schedules_count, selector_value) %}
          {% set selector_value = iif(selector_value | int <= 0, 1, selector_value) %}
          {% set selected_scheduler = input_schedulers[selector_value | int - 1] %}
        {% elif selector_value in ['on','off'] %}
          {% set selected_scheduler = iif(selector_value == 'off', input_schedulers[0], input_schedulers[1]) %}
        {% else %}
          {% set selected_scheduler = input_schedulers | expand | selectattr('attributes.friendly_name', 'eq', selector_value) | map(attribute='entity_id') | first | default(none) %}
          {% if (selected_scheduler == none) %}
            {% set selected_scheduler = input_schedulers | expand | selectattr('attributes.friendly_name', 'search', '(?i)' + selector_value) | map(attribute='entity_id') | first | default(none) %}
          {% endif %}
        {% endif %}
      {% endif %}

      {% if selected_scheduler == none %}
        {{ false }}
      {% else %}
        {{ is_state(selected_scheduler, 'off') }}
      {% endif %}

  - trigger: template
    id: temperature_change_presence_on
    value_template: "{{ input_presence_sensor != none and is_state(input_presence_sensor, 'on') }}"
    for: !input input_presence_reaction_on_time

  - trigger: template
    id: temperature_change_presence_off
    value_template: "{{ input_presence_sensor != none and is_state(input_presence_sensor, 'off') }}"
    for: !input input_presence_reaction_off_time

  - trigger: template
    id: temperature_change_presence_scheduler_on
    value_template: "{{ input_scheduler_presence != none and is_state(input_scheduler_presence, 'on') }}"
    for: !input input_action_call_delay

  - trigger: template
    id: temperature_change_presence_scheduler_off
    value_template: "{{ input_scheduler_presence != none and is_state(input_scheduler_presence, 'off') }}"
    for: !input input_action_call_delay

  - trigger: template
    id: temperature_change_person_proximity_on
    value_template: >
      {% set proximity_entities = device_entities(input_proximity) %}

      {% set is_arrived = proximity_entities
          | select('is_state','arrived')
          | expand
          | selectattr('attributes.device_class', 'eq', 'enum')
          | list | count > 0 %}

      {% set entities_towards = proximity_entities
          | expand
          | selectattr('attributes.device_class', 'eq', 'enum')
          | map(attribute='entity_id') | select('is_state','towards')
          | map('regex_replace','_(?=[^_]*$)(.*)', '')
          | list %}

      {% set distances = proximity_entities
        | expand
        | selectattr('attributes.device_class', 'eq', 'distance')
        | map(attribute='state')
        | reject('eq', 'unknown')
        | map('int')
        | select('<=', input_proximity_distance | int)
        | map('string')
        | list %}

      {% set entities_distances = proximity_entities
          | expand
          | selectattr('attributes.device_class', 'eq', 'distance')
          | selectattr('state', 'in', distances)
          | map(attribute='entity_id')
          | map('regex_replace','_(?=[^_]*$)(.*)', '')
          | list %}

      {% set entites_towards_and_in_distance = entities_towards | select('in', entities_distances) | list | count > 0 %}

      {{ entites_towards_and_in_distance or is_arrived }}
    for: !input input_proximity_duration

  - trigger: template
    id: temperature_change_person_proximity_off
    value_template: >
      {% set proximity_entities = device_entities(input_proximity) %}
      {% set is_arrived = proximity_entities
          | select('is_state','arrived')
          | expand
          | selectattr('attributes.device_class', 'eq', 'enum')
          | list | count > 0 %}

      {% set entities_towards = proximity_entities
          | expand
          | selectattr('attributes.device_class', 'eq', 'enum')
          | map(attribute='entity_id') | select('is_state','towards')
          | map('regex_replace','_(?=[^_]*$)(.*)', '')
          | list %}

      {% set distances = proximity_entities
        | expand
        | selectattr('attributes.device_class', 'eq', 'distance')
        | map(attribute='state')
        | reject('eq', 'unknown')
        | map('int')
        | select('<=', input_proximity_distance | int)
        | map('string')
        | list %}

      {% set entities_distances = proximity_entities
          | expand
          | selectattr('attributes.device_class', 'eq', 'distance')
          | selectattr('state', 'in', distances)
          | map(attribute='entity_id')
          | map('regex_replace','_(?=[^_]*$)(.*)', '')
          | list %}

      {% set entites_towards_and_in_distance = entities_towards | select('in', entities_distances) | list | count > 0 %}

      {{ entites_towards_and_in_distance == false and is_arrived == false }}
    for: !input input_proximity_duration

  - trigger: template
    value_template: "{{ expand(input_windows) | selectattr('state', 'in', ['on','open','tilted']) | list | count > 0 }}"
    for: !input input_windows_reaction_time_open
    id: temperature_change_window_on

  - trigger: template
    value_template: "{{ expand(input_windows) | selectattr('state', 'in', ['on','open','tilted']) | list | count == 0 }}"
    for: !input input_windows_reaction_time_close
    id: temperature_change_window_off

  - trigger: template
    id: temperature_change_winter_mode_on
    value_template: >
      {% if input_mode_winter != none %}
        {% set activation_state = iif(input_invert_winter_mode_value, 'off', 'on') %}
        {{ is_state(input_mode_winter, activation_state) }}
      {% endif %}
    for: !input input_action_call_delay

  - trigger: template
    id: temperature_change_winter_mode_off
    value_template: >
      {% if input_mode_winter != none %}
        {% set activation_state = iif(input_invert_winter_mode_value, 'off', 'on') %}
        {{ not is_state(input_mode_winter, activation_state) }}
      {% endif %}
    for: !input input_action_call_delay

  - trigger: template
    id: temperature_change_outside_on
    value_template: >
      {% if input_mode_outside_temperature == none %}
        {{ false }}
      {% else %}
        {% set outside_state = false %}
        {% set use_room_temp = input_mode_room_temperature and is_temperature_sensor_defined %}
        {% set room_state = iif(use_room_temp, false, true) %}

        {% set state = states(input_mode_outside_temperature) %}

        {% if state in ['unknown','unavailable'] %}
          {% set outside_state = input_fallback_outside_temperature_unavailable %}
        {% else%}
          {% set state = iif(is_number(state) == true, state, state_attr(input_mode_outside_temperature,'temperature'))%}

          {% if is_number(state) %}
            {% set outside_state = (state | float - input_mode_outside_temperature_threshold | float) * factor < 0 %}
          {% endif %}
        {% endif %}

        {% if use_room_temp %}
          {% set state = states(input_temperature_sensor) %}

          {% if is_number(state) %}
            {% set room_state = (state | float - input_mode_room_temperature_threshold | float) * factor < 0 %}
          {% endif %}
        {% endif %}

        {{ room_state and outside_state }}
      {% endif %}
    for: !input input_action_call_delay

  - trigger: template
    id: temperature_change_outside_off
    value_template: >
      {% if input_mode_outside_temperature == none %}
        {{ false }}
      {% else %}
        {% set outside_state = false %}
        {% set use_room_temp = input_mode_room_temperature and is_temperature_sensor_defined %}
        {% set room_state = iif(use_room_temp, false, true) %}

        {% set state = states(input_mode_outside_temperature) %}

        {% if state in ['unknown','unavailable'] %}
          {% set outside_state = input_fallback_outside_temperature_unavailable %}
        {% else%}
          {% set state = iif(is_number(state) == true, state, state_attr(input_mode_outside_temperature,'temperature'))%}

          {% if is_number(state) %}
            {% set outside_state = (state | float - input_mode_outside_temperature_threshold | float) * factor < 0 %}
          {% endif %}
        {% endif %}

        {% if use_room_temp %}
          {% set state = states(input_temperature_sensor) %}

          {% if is_number(state) %}
            {% set room_state = (state | float - input_mode_room_temperature_threshold | float) * factor < 0 %}
          {% endif %}
        {% endif %}

        {{ not (room_state and outside_state) }}
      {% endif %}
    for: !input input_action_call_delay

  - trigger: state
    id: temperature_change_force_max_temperature_on
    entity_id: !input input_force_max_temperature
    for: !input input_action_call_delay

  - trigger: state
    id: temperature_change_force_eco_temperature_ds
    entity_id: !input input_force_eco_temperature
    for: !input input_action_call_delay

  - trigger: template
    id: temperature_change_party_on
    value_template: "{{ input_mode_party | expand | selectattr('state', 'in', ['active','on']) | list | count > 0 }}"
    for: !input input_action_call_delay

  - trigger: template
    value_template: "{{ input_mode_party | expand | selectattr('state', 'in', ['active','on']) | list | count == 0 }}"
    id: temperature_change_party_off
    for: !input input_action_call_delay

  - trigger: state
    id: calibration_aggressive_mode_above_temp_thermostat_current_temp_change
    entity_id: !input input_trvs
    attribute: current_temperature
    for: !input input_calibration_timeout

  - trigger: state
    id: calibration_aggressive_mode_thermostat_temp_change
    entity_id: !input input_trvs
    attribute: temperature
    for:
      seconds: 30

  - trigger: state
    id: aggressive_mode_above_temp_sensor_change
    entity_id: !input input_temperature_sensor
    for:
      seconds: 30

  - trigger: state
    id: calibration_sensor_change
    entity_id: !input input_temperature_sensor
    for: !input input_calibration_timeout

  - trigger: state
    id: calibration_popp_change
    entity_id: !input input_temperature_sensor
    for:
      seconds: 2

  - trigger: template
    id: calibration_keep_alive
    value_template: >
      {% if not is_calibration_enabled %}
        {{ false }}
      {% else %}
        {% set has_external_sensor_configured = namespace(r=false) %}
        {% for valve in input_trvs %}
          {% set calibration_entity = device_entities(device_id(valve)) |
                                      expand | selectattr('domain','in','number') |
                                      selectattr('entity_id', 'search', input_calibration_key_word) |
                                      map(attribute='entity_id') | list | first | default(none) %}
          {% if calibration_entity is not none %}
            {% set fallback_min = iif('external' in calibration_entity, 0, -12)%}
            {% set fallback_max = iif('external' in calibration_entity, 50, 12)%}
            {% set calibration_entity_min = state_attr(calibration_entity,'min') | float(fallback_min) %}
            {% set calibration_entity_max = state_attr(calibration_entity,'max') | float(fallback_max) %}
            {% set is_offset_entity = ('offset' in calibration_entity or 'calibration' in calibration_entity) and not ('external' in calibration_entity) %}
            {% set has_external_sensor_configured.r = iif(not is_offset_entity, true, has_external_sensor_configured.r) %}
          {% endif %}
        {% endfor%}
        {{ has_external_sensor_configured.r and is_temperature_sensor_defined and now().strftime('%M') | int % 10 == 0 }}
      {% endif %}

  - trigger: template
    id: temperature_change_heating_adjustment
    value_template: >
      {% set timestamp = now() %}
      {% set current_day = timestamp.strftime('%a') %}
      {% set current_time = timestamp.strftime('%H:%M') %}
      {% set plan = input_adjustments | rejectattr('time', 'undefined')
          | selectattr('time','eq', current_time | string)
          | sort(attribute='time', reverse = true)
          | list  %}
      {{ plan | count > 0 and now() < now().replace(second=2) }}

  - trigger: template
    value_template: >
      {% if not input_liming_protection%}
        {{ false }}
      {% else %}
        {% set enable_liming = true %}
        {% if input_mode_winter != none %}
          {% set enable_liming = is_state(input_mode_winter,'on') or input_liming_in_winter %}
        {% endif %}
        {% set current_timestamp = now() %}
        {% set is_liming_day = input_liming_protection_day == as_datetime(current_timestamp).strftime('%a') %}
        {% set start_hour = input_liming_protection_time.split(':')[0] | int %}
        {% set start_minute = input_liming_protection_time.split(':')[1] | int %}
        {% set today_start = as_datetime(current_timestamp).replace(second=0,microsecond=0,hour=start_hour,minute=start_minute) %}
        {% set today_end = as_datetime(current_timestamp).replace(second=0,microsecond=0,hour=start_hour,minute=start_minute) + timedelta(minutes=input_liming_protection_duration | int) %}
        {% set is_liming_time = as_datetime(current_timestamp) >= today_start and as_datetime(current_timestamp) <= today_end %}
        {{ enable_liming and is_liming_day and is_liming_time }}
      {% endif %}
    id: temperature_change_liming_protection_on

  - trigger: event
    event_type: ahc_liming_end_event
    id: temperature_change_liming_protection_off
    event_data:
      automation: "{{ this.entity_id }}"

  - trigger: template
    id: temperature_change_frost_protection_on
    for: !input input_frost_protection_duration
    value_template: >
      {% set now_ts = now() %}
      {% set frost_protection_timestamp = as_datetime(now_ts) - timedelta(**input_frost_protection_duration) %}
      {% if frost_protection_timestamp == now_ts %}
        {{ false }}
      {% else %}
        {% set relevant_entities = [input_presence_sensor] + [input_mode_guest] + input_persons %}
        {% set relevant_entities_count = relevant_entities | reject('eq',none) | list | count %}
        {% if relevant_entities_count > 0 %}
          {% set presence_count = [input_presence_sensor]
              | reject('eq',none)
              | reject('is_state','on')
              | list
              | count %}
          {% set guest_mode_count = [input_mode_guest]
              | reject('eq',none)
              | reject('is_state','on')
              | list
              | count %}
          {% set person_count = input_persons
              | reject('is_state','home')
              | list
              | count %}
          {{ presence_count + guest_mode_count + person_count == relevant_entities_count }}
        {% else %}
          {{ false }}
        {% endif %}
      {% endif %}

variables:
  input_trvs: !input input_trvs
  input_hvac_mode_eco: !input input_hvac_mode_eco
  input_hvac_mode_comfort: !input input_hvac_mode_comfort
  input_temperature_sensor: !input input_temperature_sensor

  input_temperature_comfort: !input input_temperature_comfort
  input_temperature_comfort_entity: "{{ iif(input_temperature_comfort == [], none, input_temperature_comfort) }}"
  input_temperature_comfort_static: !input input_temperature_comfort_static
  input_temperature_comfort_static_entity: !input input_temperature_comfort_static_entity
  fallback_comfort_temperature: >
    {% if input_temperature_comfort_static_entity != [] %}
      {{ states(input_temperature_comfort_static_entity) }}
    {% else %}
      {{ input_temperature_comfort_static }}
    {% endif %}

  input_temperature_eco: !input input_temperature_eco
  input_temperature_eco_entity: "{{ iif(input_temperature_eco == [], none, input_temperature_eco) }}"

  input_temperature_eco_static: !input input_temperature_eco_static
  input_temperature_eco_static_entity: !input input_temperature_eco_static_entity
  fallback_eco_temperature: >
    {% if input_temperature_eco_static_entity != [] %}
      {{ states(input_temperature_eco_static_entity) }}
    {% else %}
      {{ input_temperature_eco_static }}
    {% endif %}

  input_frost_protection_temp: !input input_frost_protection_temp
  input_frost_protection_duration: !input input_frost_protection_duration

  input_liming_protection: !input input_liming_protection
  input_liming_protection_day: !input input_liming_protection_day
  input_liming_protection_time: !input input_liming_protection_time
  input_liming_in_winter: !input input_liming_in_winter
  input_liming_protection_duration: !input input_liming_protection_duration

  input_schedulers: !input input_schedulers
  input_scheduler_selector: !input input_scheduler_selector

  input_presence_sensor: !input input_presence_sensor
  input_scheduler_presence: !input input_scheduler_presence
  input_presence_reaction_off_time: !input input_presence_reaction_off_time
  input_presence_reaction_on_time: !input input_presence_reaction_on_time

  input_windows: !input input_windows
  input_windows_reaction_time_open: !input input_windows_reaction_time_open
  input_windows_reaction_time_close: !input input_windows_reaction_time_close
  input_window_open_temperature: !input input_window_open_temperature
  input_window_open_temperature_number: !input input_window_open_temperature_number
  input_party_legacy_restore: !input input_party_legacy_restore
  input_window_legacy_restore: !input input_window_legacy_restore
  is_legacy_restore: "{{ input_party_legacy_restore or input_window_legacy_restore }}"

  input_mode_winter: !input input_mode_winter
  input_invert_winter_mode_value: !input input_invert_winter_mode_value
  input_mode_outside_temperature: !input input_mode_outside_temperature
  input_mode_outside_temperature_threshold: !input input_mode_outside_temperature_threshold
  input_fallback_outside_temperature_unavailable: !input input_fallback_outside_temperature_unavailable
  input_mode_room_temperature: !input input_mode_room_temperature
  input_mode_room_temperature_threshold: !input input_mode_room_temperature_threshold

  input_proximity: !input input_proximity

  input_persons: !input input_persons
  input_mode_guest: !input input_mode_guest
  input_people_entering_home_duration: !input input_people_entering_home_duration
  input_people_leaving_home_duration: !input input_people_leaving_home_duration

  input_mode_party: !input input_mode_party
  input_force_max_temperature: !input input_force_max_temperature
  input_force_eco_temperature: !input input_force_eco_temperature

  is_calibration_enabled: !input input_is_calibration_enabled
  input_calibration_delta: !input input_calibration_delta
  input_calibration_generic: !input input_calibration_generic
  input_calibration_step_size: !input input_calibration_step_size
  input_calibration_key_word: !input input_calibration_key_word
  input_generic_calibration_offset: !input input_generic_calibration_offset

  input_aggressive_mode_offset: !input input_aggressive_mode_offset
  input_aggressive_mode_range: !input input_aggressive_mode_range
  input_aggressive_mode_calibration: !input input_aggressive_mode_calibration

  input_away_offset: !input input_away_offset
  is_scheduler_away_mode: !input input_away_scheduler_mode
  is_presence_away_mode: !input input_away_presence_mode
  presence_ignor_people: !input input_away_presence_ignor_people

  input_adjustments: !input input_adjustments
  input_sync_adjustments_with_entities: !input input_sync_adjustments_with_entities

  is_reset_temperature: !input input_reset_temperature
  is_not_off_but_min: !input input_min_instead_of_off
  is_fahrenheit: !input input_fahrenheit
  is_heat_only_if_below_real_temp: !input input_off_if_above_room_temperature
  is_physical_change_enabled: !input input_physical_change
  is_ui_change_enabled: !input input_ui_change
  is_off_if_nobody_home: !input input_off_if_nobody_home

  input_action_call_delay: !input input_action_call_delay
  input_custom_action: !input input_custom_action
  input_startup_delay: !input input_startup_delay

  input_fully_open_difference: !input input_fully_open_difference
  input_valve_opening_keyword: !input input_valve_opening_keyword
  input_valve_positioning_step_size: !input input_valve_positioning_step_size
  input_valve_positioning_mode: !input input_valve_positioning_mode
  input_valve_positioning_timeout: !input input_valve_positioning_timeout
  input_valve_positioning_max_opening: !input input_valve_positioning_max_opening

  is_temperature_sensor_defined: "{{ input_temperature_sensor != [] }}"
  invalid_states: "{{ ['unknown', 'unavailable'] }}"

  value_temperature_sensor: >
    {% if is_temperature_sensor_defined %}
      {{ states(input_temperature_sensor) }}
    {% else %}
      {{ 'unknown' }}
    {% endif %}

  valid_temperature_sensor: "{{ value_temperature_sensor not in invalid_states }}"

  current_time_stamp: "{{ now() }}"
  is_metric: "{{ not is_temperature_sensor_defined or (is_temperature_sensor_defined and state_attr(input_temperature_sensor,'unit_of_measurement') == '°C') }}"

  up_time_sensor: "{{ integration_entities('uptime') | first | default(none) }}"
  is_uptime_defined: "{{ up_time_sensor != none }}"
  uptime: >
    {% if is_uptime_defined %}
      {{ states(up_time_sensor) | as_datetime }}
    {% else %}
      {{ current_time_stamp | as_datetime }}
    {% endif %}

  startup_delay: >
    {% set start_delay_seconds = timedelta(**input_startup_delay).total_seconds() %}
    {% if not is_uptime_defined or start_delay_seconds == 0 %}
      {{ none }}
    {% else %}
      {% set difference = (current_time_stamp | as_datetime - uptime | as_datetime).total_seconds() %}
      {% set real_start_delay = (start_delay_seconds - difference) %}
      {{ iif(real_start_delay > 0, real_start_delay, none) }}
    {% endif %}

  factor: "{{ iif(input_hvac_mode_eco == 'cool' or input_hvac_mode_comfort == 'cool', -1, 1) | int }}"

  state_outside_temp: >
    {% if input_mode_outside_temperature == none %}
        {{ none }}
    {% else %}
      {% set outside_state = false %}
      {% set use_room_temp = input_mode_room_temperature and is_temperature_sensor_defined %}
      {% set room_state = iif(use_room_temp, false, true) %}
      {% set state = states(input_mode_outside_temperature) %}
      {% if state in ['unknown','unavailable'] %}
        {% set outside_state = input_fallback_outside_temperature_unavailable %}
      {% else%}
        {% set state = iif(is_number(state) == true, state, state_attr(input_mode_outside_temperature,'temperature'))%}
        {% if is_number(state) %}
          {% set outside_state = (state | float - input_mode_outside_temperature_threshold | float) * factor < 0 %}
        {% endif %}
      {% endif %}
      {% if use_room_temp %}
        {% set state = states(input_temperature_sensor) %}
        {% if is_number(state) %}
          {% set room_state = (state | float - input_mode_room_temperature_threshold | float) * factor < 0 %}
        {% endif %}
      {% endif %}
      {{ room_state and outside_state }}
    {% endif %}

  state_ahc: >
    {% set result = true %}
    {% if input_mode_winter != none %}
      {% set activation_state = iif(input_invert_winter_mode_value, 'off', 'on') %}
      {% set result = is_state(input_mode_winter, activation_state) %}
    {% endif %}
    {{ iif(state_outside_temp == none, result, result and state_outside_temp) }}

  is_proximity_defined: "{{ input_proximity != none }}"

  state_proximity_arrived: >
    {% set proximity_entities = device_entities(input_proximity) %}
    {% set is_arrived = proximity_entities
        | select('is_state','arrived')
        | expand
        | selectattr('attributes.device_class', 'eq', 'enum')
        | list | count > 0 %}
    {{ is_arrived }}

  state_proximity_way_home: >
    {% set proximity_entities = device_entities(input_proximity) %}
    {% set earliest_timestamp = current_time_stamp | as_datetime - timedelta(**input_proximity_duration) %}
    {% set uptime_duration = as_datetime(uptime) + timedelta(**input_proximity_duration) %}
    {% if uptime_duration > earliest_timestamp %}
      {% set earliest_timestamp = uptime_duration%}
    {% endif %}
    {% set entities_towards = proximity_entities
        | expand
        | selectattr('attributes.device_class', 'eq', 'enum')
        | selectattr('last_changed', '<=', earliest_timestamp)
        | map(attribute='entity_id') | select('is_state','towards')
        | map('regex_replace','_(?=[^_]*$)(.*)', '')
        | list %}
    {% set distances = proximity_entities
        | expand
        | selectattr('attributes.device_class', 'eq', 'distance')
        | map(attribute='state')
        | reject('eq', 'unknown')
        | map('int')
        | select('<=', input_proximity_distance | int)
        | map('string')
        | list %}
    {% set entities_distances = proximity_entities
        | expand
        | selectattr('attributes.device_class', 'eq', 'distance')
        | selectattr('state', 'in', distances)
        | map(attribute='entity_id')
        | map('regex_replace','_(?=[^_]*$)(.*)', '')
        | list %}
    {% set towards_and_in_distance = entities_towards | select('in', entities_distances) | list | count > 0 %}
    {{ towards_and_in_distance }}

  is_person_defined: "{{ input_persons | count > 0 or input_mode_guest != none }}"
  is_guest_mode: "{{ input_mode_guest != none and is_state(input_mode_guest, 'on') }}"
  is_anybody_home: >
    {% if is_guest_mode %}
      {{ true }}
    {% elif not is_person_defined %}
      {{ false }}
    {% else %}
      {% set on_time_delta = current_time_stamp | as_datetime - timedelta(**input_people_entering_home_duration) %}
